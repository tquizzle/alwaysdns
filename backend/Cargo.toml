[package]
name = "dnsui"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
getrandom = "0.4.3"
hex = "0.4.3"
hickory-proto = "0.26.3"
hickory-resolver = { version = "0.26.3", features = ["https-ring", "quic-ring", "rustls-platform-verifier", "tokio"] }
hickory-server = "0.26.3"
ipnet = "2.12.2"
maxminddb = "0.32.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
