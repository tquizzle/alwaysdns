name: Audit

on:
  pull_request:
    paths:
      - backend/Cargo.lock
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - backend/Cargo.lock
      - .github/workflows/audit.yml
  schedule:
    # Weekly, Mondays 06:23 UTC. New advisories are published without any commit.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    env:
      # cargo-audit 0.22.2 (latest on crates.io when this was pinned)
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust 1.97 (matches deploy/Dockerfile)
        run: |
          rustup toolchain install 1.97 --profile minimal
          rustup default 1.97
      - name: Restore cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: Audit Cargo.lock for known vulnerabilities
        working-directory: backend
        run: cargo audit
